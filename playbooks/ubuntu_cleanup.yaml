---
- name: Uninstall CloudLens Agent from Ubuntu VMs
  hosts: "{{ target_group }}"
  become: yes
  vars_files:
    - ../vars/cloudlens.yaml

  tasks:
    - name: Gather facts about the system
      ansible.builtin.setup:

    - name: Check if Docker is installed
      ansible.builtin.command: command -v docker
      register: docker_installed
      failed_when: false
      changed_when: false

    - name: Display Docker installation status
      debug:
        msg: "Docker is {{ 'installed' if docker_installed.rc == 0 else 'not installed' }}"

    - name: Force stop and remove CloudLens container
      ansible.builtin.shell: |
        docker stop {{ cloudlens_agent_container_name }} 2>/dev/null || true
        docker rm -f {{ cloudlens_agent_container_name }} 2>/dev/null || true
      when: docker_installed.rc == 0
      register: container_removal

    - name: Verify container is removed
      ansible.builtin.shell: docker ps -a --filter name={{ cloudlens_agent_container_name }} --format '{{"{{"}}.Names{{"}}"}}'
      register: verify_removed
      when: docker_installed.rc == 0
      changed_when: false

    - name: Display container status after removal
      debug:
        msg: "Container {{ 'STILL EXISTS' if (verify_removed.stdout | default('')) != '' else 'REMOVED' }}"
      when: verify_removed is defined

    - name: Fail if container still exists
      fail:
        msg: "CloudLens container still exists after removal!"
      when: 
        - verify_removed is defined
        - verify_removed.stdout is defined
        - verify_removed.stdout != ""

    - name: Remove CloudLens sensor image
      ansible.builtin.shell: docker rmi -f {{ cloudlens_manager_ip_or_FQDN }}/sensor 2>/dev/null || true
      when: docker_installed.rc == 0

    - name: Remove CA certificate from ca_cert_dir
      ansible.builtin.file:
        path: "{{ ca_cert_dir }}/cloudlenscerts.crt"
        state: absent
      when: registry_type == "secure"

    - name: Remove CA certificate from Docker certs.d directory
      ansible.builtin.file:
        path: "/etc/docker/certs.d/{{ cloudlens_manager_ip_or_FQDN }}/ca.crt"
        state: absent
      when: registry_type == "secure"

    - name: Remove Docker certs.d directory for CloudLens
      ansible.builtin.file:
        path: "/etc/docker/certs.d/{{ cloudlens_manager_ip_or_FQDN }}"
        state: absent
      when: registry_type == "secure"

    - name: Remove Docker daemon configuration
      ansible.builtin.file:
        path: /etc/docker/daemon.json
        state: absent

    - name: Remove CloudLens log directory
      ansible.builtin.file:
        path: /var/log/cloudlens
        state: absent

    - name: Remove Docker volumes related to CloudLens
      ansible.builtin.shell: docker volume ls -q | grep cloudlens | xargs -r docker volume rm 2>/dev/null || true
      when: docker_installed.rc == 0
      ignore_errors: yes

    - name: Check for other containers
      ansible.builtin.shell: docker ps -a --format '{{"{{"}}.Names{{"}}"}}'
      register: other_containers
      when: docker_installed.rc == 0
      changed_when: false
      failed_when: false

    - name: Display other containers
      debug:
        msg: "Other containers: {{ other_containers.stdout_lines | default(['None']) }}"
      when: other_containers is defined

    - name: Stop Docker service (OPTIONAL)
      ansible.builtin.systemd:
        name: docker
        state: stopped
      when: remove_docker | default(false) | bool
      ignore_errors: yes

    - name: Remove Docker packages (OPTIONAL)
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: absent
        autoremove: yes
      when: remove_docker | default(false) | bool

    - name: Remove Docker repository (OPTIONAL)
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent
      when: remove_docker | default(false) | bool

    - name: Remove Docker GPG key (OPTIONAL)
      ansible.builtin.file:
        path: /usr/share/keyrings/docker-archive-keyring.gpg
        state: absent
      when: remove_docker | default(false) | bool

    - name: Remove /etc/docker directory (OPTIONAL)
      ansible.builtin.file:
        path: /etc/docker
        state: absent
      when: remove_docker | default(false) | bool

    - name: Final verification
      ansible.builtin.shell: |
        echo "=== Containers ==="
        docker ps -a 2>/dev/null || echo "Docker not running"
        echo ""
        echo "=== CloudLens processes ==="
        ps aux | grep -i cloudlens | grep -v grep || echo "None found"
        echo ""
        echo "=== CloudLens files ==="
        find /var/log -name "*cloudlens*" 2>/dev/null || echo "None found"
      register: final_check
      when: docker_installed.rc == 0
      changed_when: false
      failed_when: false

    - name: Display final status
      debug:
        var: final_check.stdout_lines
      when: final_check is defined and final_check.stdout_lines is defined