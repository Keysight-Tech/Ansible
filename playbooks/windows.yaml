---
- name: Deploy CloudLens Agent to Windows VMs
  hosts: "{{ target_group }}"
  become: no
  vars_files:
    - ../vars/cloudlens.yaml
  
  tasks:
    - name: Ensure C:\temp directory exists
      win_file:
        path: C:\temp
        state: directory

    - name: Check for CloudLens Agent in registry
      win_shell: |
        $apps = Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*, HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue | 
          Where-Object { $_.DisplayName -like "*CloudLens*" }
        if ($apps) {
          @{
            Installed = $true
            DisplayName = $apps[0].DisplayName
            Version = $apps[0].DisplayVersion
          } | ConvertTo-Json
        } else {
          @{ Installed = $false } | ConvertTo-Json
        }
      register: cloudlens_installed_check
      changed_when: false

    - name: Parse installation check result
      set_fact:
        cloudlens_is_installed: "{{ (cloudlens_installed_check.stdout | from_json).Installed | default(false) }}"
        cloudlens_current_version: "{{ (cloudlens_installed_check.stdout | from_json).Version | default('Not installed') }}"

    - name: Display current installation status
      debug:
        msg: 
          - "CloudLens Agent installed: {{ cloudlens_is_installed }}"
          - "Current version: {{ cloudlens_current_version }}"

    - name: Handle SSL certificate if required
      when: ssl_verify | default('no') | lower == 'yes'
      block:
        - name: Copy CA certificate to Windows VM
          win_copy:
            src: "{{ local_ca_path }}"
            dest: C:\temp\cloudlens_ca.crt

        - name: Import CA cert into Trusted Root Certification Authorities
          win_certificate_store:
            path: C:\temp\cloudlens_ca.crt
            store_name: Root
            state: present

    - name: Uninstall existing CloudLens Agent
      when: cloudlens_is_installed
      block:
        - name: Stop CloudLens service
          win_service:
            name: CloudLens
            state: stopped
            force_dependent_services: yes
          ignore_errors: yes

        - name: Wait for service to stop
          win_shell: |
            $maxWait = 30
            $waited = 0
            while ($waited -lt $maxWait) {
              $service = Get-Service -Name CloudLens -ErrorAction SilentlyContinue
              if (-not $service -or $service.Status -eq 'Stopped') {
                exit 0
              }
              Start-Sleep -Seconds 2
              $waited += 2
            }
            exit 1
          register: service_stop_wait
          failed_when: false

        - name: Kill any remaining CloudLens processes
          win_shell: |
            Get-Process | Where-Object { $_.ProcessName -like "*CloudLens*" -or $_.ProcessName -like "*agent*" } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 5
          ignore_errors: yes

        - name: Uninstall CloudLens Agent via MSI/EXE
          win_shell: |
            $apps = Get-ItemProperty HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*, HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\* -ErrorAction SilentlyContinue | 
              Where-Object { $_.DisplayName -like "*CloudLens*" }
            
            $uninstalled = $false
            
            if ($apps) {
              foreach ($app in $apps) {
                $uninstallString = $app.UninstallString
                
                # Try MSI uninstall
                if ($uninstallString -match '\{([A-F0-9-]+)\}') {
                  $productCode = $matches[1]
                  Write-Output "Uninstalling MSI: $productCode"
                  $proc = Start-Process msiexec.exe -ArgumentList "/x {$productCode} /quiet /norestart /l*v C:\temp\cloudlens_uninstall.log" -Wait -PassThru -NoNewWindow
                  if ($proc.ExitCode -eq 0 -or $proc.ExitCode -eq 3010) {
                    $uninstalled = $true
                  }
                }
                # Try EXE uninstall
                elseif ($uninstallString -match '\.exe') {
                  $exePath = ($uninstallString -replace '"','').Trim()
                  if (Test-Path $exePath) {
                    Write-Output "Uninstalling EXE: $exePath"
                    $proc = Start-Process -FilePath $exePath -ArgumentList "/uninstall /quiet" -Wait -PassThru -NoNewWindow
                    if ($proc.ExitCode -eq 0) {
                      $uninstalled = $true
                    }
                  }
                }
              }
            }
            
            @{ Uninstalled = $uninstalled } | ConvertTo-Json
          register: uninstall_result

        - name: Wait for uninstallation to complete
          ansible.builtin.pause:
            seconds: 45

        - name: Verify service removal
          win_shell: |
            $service = Get-Service -Name CloudLens -ErrorAction SilentlyContinue
            if ($service) {
              # Service still exists, try to remove it
              sc.exe delete CloudLens
              Start-Sleep -Seconds 5
            }
          ignore_errors: yes

        - name: Clean up installation directories
          win_file:
            path: "{{ item }}"
            state: absent
          loop:
            - C:\Program Files\Keysight\CloudLens
            - C:\Program Files (x86)\Keysight\CloudLens
          ignore_errors: yes

        - name: Clean up ProgramData (preserve logs)
          win_shell: |
            if (Test-Path "C:\ProgramData\CloudLens\Config") {
              Remove-Item "C:\ProgramData\CloudLens\Config" -Recurse -Force -ErrorAction SilentlyContinue
            }
          ignore_errors: yes

        - name: Wait for filesystem cleanup
          ansible.builtin.pause:
            seconds: 10

    - name: Install CloudLens Agent
      block:
        - name: Transfer CloudLens Agent installer
          win_copy:
            src: "{{ local_installer_path }}"
            dest: C:\temp\{{ cloudlens_installer_filename }}

        - name: Run CloudLens Agent installation
          win_shell: |
            $arguments = @(
              "/install",
              "/quiet",
              "Server=`"{{ cloudlens_manager_ip_or_FQDN }}`"",
              "Project_Key=`"{{ project_key }}`"",
              "SSL_Verify=`"{{ ssl_verify | default('no') }}`"",
              "Auto_Update=`"{{ auto_update | default('yes') }}`""
            )
            
            if ("{{ custom_tags | default('') }}" -ne "") {
              $arguments += "Custom_Tags=`"{{ custom_tags }}`""
            }
            
            $logFile = "C:\temp\cloudlens_install.log"
            
            $process = Start-Process -FilePath "C:\temp\{{ cloudlens_installer_filename }}" `
              -ArgumentList $arguments `
              -Wait `
              -PassThru `
              -NoNewWindow `
              -RedirectStandardOutput "$logFile.stdout" `
              -RedirectStandardError "$logFile.stderr"
            
            @{
              ExitCode = $process.ExitCode
              Success = ($process.ExitCode -eq 0)
            } | ConvertTo-Json
          register: install_result

        - name: Parse installation result
          set_fact:
            install_exit_code: "{{ (install_result.stdout | from_json).ExitCode | int }}"
            install_success: "{{ (install_result.stdout | from_json).Success }}"

        - name: Display installation result
          debug:
            msg: "Installation exit code: {{ install_exit_code }} - Success: {{ install_success }}"

        - name: Fail if installation failed
          fail:
            msg: "CloudLens Agent installation failed with exit code {{ install_exit_code }}"
          when: not install_success

        - name: Wait for installation to complete
          ansible.builtin.pause:
            seconds: 30

        - name: Wait for config file creation
          win_shell: |
            $maxWait = 60
            $waited = 0
            while ($waited -lt $maxWait) {
              if (Test-Path "C:\ProgramData\CloudLens\Config\agent.yml") {
                Write-Output "Config file found"
                exit 0
              }
              Start-Sleep -Seconds 2
              $waited += 2
            }
            Write-Output "Config file not found after $waited seconds"
            exit 1
          register: config_wait
          retries: 3
          delay: 10
          until: config_wait.rc == 0

    - name: Ensure CloudLens service is running
      block:
        - name: Check if service exists
          win_shell: |
            $service = Get-Service -Name CloudLens -ErrorAction SilentlyContinue
            if ($service) {
              @{
                Exists = $true
                Status = $service.Status.ToString()
              } | ConvertTo-Json
            } else {
              @{ Exists = $false } | ConvertTo-Json
            }
          register: service_check
          changed_when: false

        - name: Parse service check
          set_fact:
            service_exists: "{{ (service_check.stdout | from_json).Exists }}"
            service_status: "{{ (service_check.stdout | from_json).Status | default('NotFound') }}"

        - name: Start CloudLens service if not running
          win_service:
            name: CloudLens
            state: started
            start_mode: auto
          when: service_exists and service_status != 'Running'
          register: service_start
          retries: 3
          delay: 10
          until: service_start is succeeded

        - name: Wait for service to stabilize
          ansible.builtin.pause:
            seconds: 30

    - name: Verify CloudLens Agent is running
      win_shell: |
        $maxRetries = 5
        $retryCount = 0
        
        while ($retryCount -lt $maxRetries) {
          $service = Get-Service -Name "CloudLens" -ErrorAction SilentlyContinue
          $processes = Get-Process | Where-Object { $_.ProcessName -like "*CloudLens*" -or $_.ProcessName -eq "agent" }
          
          $result = @{
            ServiceExists = [bool]$service
            ServiceStatus = if ($service) { $service.Status.ToString() } else { "Not Found" }
            ProcessRunning = ($processes.Count -gt 0)
            ProcessCount = $processes.Count
            Attempt = $retryCount + 1
          }
          
          # Success condition
          if ($result.ServiceStatus -eq "Running" -and $result.ProcessRunning) {
            $result.Success = $true
            $result | ConvertTo-Json
            exit 0
          }
          
          $retryCount++
          if ($retryCount -lt $maxRetries) {
            Start-Sleep -Seconds 10
          }
        }
        
        # Failed after all retries
        $result.Success = $false
        $result | ConvertTo-Json
        exit 0
      register: final_status_check
      changed_when: false

    - name: Parse final status
      set_fact:
        final_status: "{{ final_status_check.stdout | from_json }}"

    - name: Display final status
      debug:
        msg:
          - "Service exists: {{ final_status.ServiceExists }}"
          - "Service status: {{ final_status.ServiceStatus }}"
          - "Process running: {{ final_status.ProcessRunning }}"
          - "Process count: {{ final_status.ProcessCount }}"
          - "Verification attempts: {{ final_status.Attempt }}"
          - "Result: {{ 'SUCCESS' if final_status.Success else 'FAILED' }}"

    - name: Fail if CloudLens is not running properly
      fail:
        msg: "CloudLens Agent is not running properly after installation"
      when: not final_status.Success

    - name: Clean up installer file
      win_file:
        path: C:\temp\{{ cloudlens_installer_filename }}
        state: absent
      ignore_errors: yes