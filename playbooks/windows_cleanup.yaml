---
- name: Uninstall CloudLens Agent from Windows VMs
  hosts: "{{ target_group }}"
  become: no
  vars_files:
    - ../vars/cloudlens.yml
  
  tasks:
    - name: Check if CloudLens Agent is installed (both registry paths)
      win_shell: |
        $paths = @(
          "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
          "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
        )
        $found = Get-ItemProperty $paths -ErrorAction SilentlyContinue | 
          Where-Object { $_.DisplayName -like "*CloudLens*" }
        if ($found) {
          Write-Output "FOUND"
          Write-Output "DisplayName: $($found.DisplayName)"
          Write-Output "UninstallString: $($found.UninstallString)"
          $found.PSChildName
        } else {
          Write-Output "NOT_FOUND"
        }
      register: cloudlens_check
      changed_when: false

    - name: Display what was found
      debug:
        var: cloudlens_check.stdout_lines

    - name: Stop CloudLens service if running
      win_service:
        name: CloudLens
        state: stopped
      ignore_errors: true
      when: "'FOUND' in cloudlens_check.stdout"

    - name: Get uninstall string from registry
      win_shell: |
        $paths = @(
          "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
          "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
        )
        $app = Get-ItemProperty $paths -ErrorAction SilentlyContinue | 
          Where-Object { $_.DisplayName -like "*CloudLens*" }
        if ($app.UninstallString) {
          $app.UninstallString
        }
      register: uninstall_string
      when: "'FOUND' in cloudlens_check.stdout"
      changed_when: false

    - name: Uninstall CloudLens Agent using MSI uninstaller
      win_shell: |
        $uninstallCmd = "{{ uninstall_string.stdout | trim }}"
        if ($uninstallCmd -match "msiexec") {
          # MSI-based uninstall - add /quiet /norestart
          $productCode = $uninstallCmd -replace '.*\{([A-F0-9-]+)\}.*', '{$1}'
          $result = Start-Process msiexec.exe -ArgumentList "/x $productCode /quiet /norestart" -Wait -PassThru
          Write-Output "Uninstall exit code: $($result.ExitCode)"
          exit $result.ExitCode
        } elseif ($uninstallCmd) {
          # EXE-based uninstall
          $result = Start-Process -FilePath $uninstallCmd -ArgumentList "/uninstall /quiet" -Wait -PassThru
          Write-Output "Uninstall exit code: $($result.ExitCode)"
          exit $result.ExitCode
        } else {
          Write-Output "No uninstall string found"
          exit 1
        }
      register: uninstall_result
      when: 
        - "'FOUND' in cloudlens_check.stdout"
        - uninstall_string.stdout is defined
        - uninstall_string.stdout | trim != ""
      failed_when: uninstall_result.rc not in [0, 1605, 3010]  # 0=success, 1605=not found, 3010=reboot required

    - name: Display uninstall result
      debug:
        var: uninstall_result.stdout_lines
      when: uninstall_result is defined

    - name: Wait for uninstall to complete
      ansible.builtin.pause:
        seconds: 10
      when: "'FOUND' in cloudlens_check.stdout"

    - name: Verify CloudLens is uninstalled
      win_shell: |
        $paths = @(
          "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
          "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
        )
        $still_exists = Get-ItemProperty $paths -ErrorAction SilentlyContinue | 
          Where-Object { $_.DisplayName -like "*CloudLens*" }
        if ($still_exists) {
          Write-Output "STILL_EXISTS"
          exit 1
        } else {
          Write-Output "SUCCESSFULLY_REMOVED"
          exit 0
        }
      register: verify_uninstall
      changed_when: false
      failed_when: false

    - name: Display verification result
      debug:
        msg: "CloudLens uninstall verification: {{ verify_uninstall.stdout | trim }}"

    - name: Remove installation directory if exists
      win_file:
        path: C:\Program Files\Keysight\CloudLens
        state: absent
      ignore_errors: true

    - name: Remove ProgramData directory if exists
      win_file:
        path: C:\ProgramData\CloudLens
        state: absent
      ignore_errors: true

    - name: Delete CloudLens installer from C:\temp
      win_file:
        path: "C:\\temp\\{{ cloudlens_installer_filename }}"
        state: absent

    - name: Delete CA cert from temp if present
      win_file:
        path: C:\temp\cloudlens_ca.crt
        state: absent

    - name: Final status message
      debug:
        msg: "CloudLens Agent uninstall completed. Status: {{ 'SUCCESS' if verify_uninstall.stdout | trim == 'SUCCESSFULLY_REMOVED' else 'VERIFY MANUALLY' }}"