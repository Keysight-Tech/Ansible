---
- name: Uninstall CloudLens Agent from Windows VMs
  hosts: "{{ target_group }}"
  become: no
  vars_files:
    - ../vars/cloudlens.yml
  
  tasks:
    - name: Check if CloudLens is installed
      win_shell: |
        $paths = @(
          "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
          "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
        )
        $found = Get-ItemProperty $paths -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*CloudLens*" }
        if ($found) { Write-Output "FOUND" } else { Write-Output "NOT_FOUND" }
      register: cloudlens_check
      changed_when: false

    - name: Stop CloudLens service
      win_service:
        name: CloudLens
        state: stopped
      ignore_errors: true
      when: "'FOUND' in cloudlens_check.stdout"

    - name: Uninstall CloudLens Agent
      win_shell: |
        $paths = @(
          "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
          "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
        )
        $app = Get-ItemProperty $paths -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*CloudLens*" }
        
        if (-not $app.UninstallString) {
          Write-Output "No uninstall string found"
          exit 1
        }
        
        $uninstallLines = $app.UninstallString -split "`n"
        
        # Try MSI first
        $msiLine = $uninstallLines | Where-Object { $_ -match "MsiExec" } | Select-Object -First 1
        if ($msiLine -and $msiLine -match '\{([A-F0-9-]+)\}') {
          $productCode = $matches[1]
          Write-Output "Uninstalling MSI product: {$productCode}"
          $proc = Start-Process msiexec.exe -ArgumentList "/x {$productCode} /quiet /norestart" -Wait -PassThru
          Write-Output "Exit code: $($proc.ExitCode)"
          exit $proc.ExitCode
        }
        
        # Try EXE if MSI failed
        $exeLine = $uninstallLines | Where-Object { $_ -match "\.exe" } | Select-Object -First 1
        if ($exeLine) {
          $exePath = $exeLine.Trim().Trim('"')
          Write-Output "Uninstalling using EXE: $exePath"
          $proc = Start-Process -FilePath $exePath -ArgumentList "/uninstall /quiet" -Wait -PassThru
          Write-Output "Exit code: $($proc.ExitCode)"
          exit $proc.ExitCode
        }
        
        Write-Output "No valid uninstall method found"
        exit 1
      register: uninstall_result
      when: "'FOUND' in cloudlens_check.stdout"
      failed_when: uninstall_result.rc not in [0, 1605, 3010]

    - name: Wait for uninstall
      ansible.builtin.pause:
        seconds: 15
      when: "'FOUND' in cloudlens_check.stdout"

    - name: Verify removal
      win_shell: |
        $paths = @(
          "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
          "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
        )
        $exists = Get-ItemProperty $paths -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*CloudLens*" }
        if ($exists) { Write-Output "STILL_EXISTS"; exit 1 } else { Write-Output "REMOVED"; exit 0 }
      register: verify_uninstall
      changed_when: false

    - name: Remove directories
      win_file:
        path: "{{ item }}"
        state: absent
      loop:
        - C:\Program Files\Keysight\CloudLens
        - C:\ProgramData\CloudLens
        - "C:\\temp\\{{ cloudlens_installer_filename }}"
        - C:\temp\cloudlens_ca.crt
      ignore_errors: true

    - name: Final status
      debug:
        msg: "Uninstall {{ 'SUCCESSFUL' if 'REMOVED' in verify_uninstall.stdout else 'FAILED - CHECK MANUALLY' }}"