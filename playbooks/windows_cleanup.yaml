---
- name: Uninstall CloudLens Agent from Windows VMs
  hosts: "{{ target_group }}"
  become: no
  vars_files:
    - ../vars/cloudlens.yml
  
  tasks:
    - name: Check if CloudLens Agent is installed
      win_shell: |
        $paths = @(
          "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
          "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
        )
        $found = Get-ItemProperty $paths -ErrorAction SilentlyContinue | 
          Where-Object { $_.DisplayName -like "*CloudLens*" }
        if ($found) {
          Write-Output "FOUND"
        } else {
          Write-Output "NOT_FOUND"
        }
      register: cloudlens_check
      changed_when: false

    - name: Stop CloudLens service
      win_service:
        name: CloudLens
        state: stopped
      ignore_errors: true
      when: "'FOUND' in cloudlens_check.stdout"

    - name: Uninstall CloudLens Agent using MSI
      win_shell: |
        $paths = @(
          "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
          "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
        )
        $app = Get-ItemProperty $paths -ErrorAction SilentlyContinue | 
          Where-Object { $_.DisplayName -like "*CloudLens*" }
        
        if ($app.UninstallString) {
          # Split on newlines in case there are multiple uninstall methods
          $uninstallLines = $app.UninstallString -split "`n"
          
          # Try MSI first
          $msiLine = $uninstallLines | Where-Object { $_ -match "MsiExec" } | Select-Object -First 1
          if ($msiLine) {
            if ($msiLine -match '\{([A-F0-9-]+)\}') {
              $productCode = $matches[1]
              Write-Output "Using MSI uninstall for product: {$productCode}"
              $result = Start-Process msiexec.exe -ArgumentList "/x {$productCode} /quiet /norestart" -Wait -PassThru
              Write-Output "MSI uninstall exit code: $($result.ExitCode)"
              exit $result.ExitCode
            }
          }
          
          # Try EXE if MSI didn't work
          $exeLine = $uninstallLines | Where-Object { $_ -match "\.exe" } | Select-Object -First 1
          if ($exeLine) {
            $exeLine = $exeLine.Trim('"')
            Write-Output "Using EXE uninstall: $exeLine"
            $result = Start-Process -FilePath $exeLine -ArgumentList "/uninstall /quiet" -Wait -PassThru
            Write-Output "EXE uninstall exit code: $($result.ExitCode)"
            exit $result.ExitCode
          }
        }
        
        Write-Output "No valid uninstall method found"
        exit 1
      register: uninstall_result
      when: "'FOUND' in cloudlens_check.stdout"
      failed_when: uninstall_result.rc not in [0, 1605, 3010]

    - name: Display uninstall result
      debug:
        var: uninstall_result.stdout_lines
      when: uninstall_result is defined

    - name: Wait for uninstall to complete
      ansible.builtin.pause:
        seconds: 15
      when: "'FOUND' in cloudlens_check.stdout"

    - name: Verify CloudLens is uninstalled
      win_shell: |
        $paths = @(
          "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
          "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
        )
        $still_exists = Get-ItemProperty $paths -ErrorAction SilentlyContinue | 
          Where-Object { $_.DisplayName -like "*CloudLens*" }
        if ($still_exists) {
          Write-Output "STILL_EXISTS"
          exit 1
        } else {
          Write-Output "SUCCESSFULLY_REMOVED"
          exit 0
        }
      register: verify_uninstall
      changed_when: false

    - name: Fail if still installed
      fail:
        msg: "CloudLens Agent is still installed after uninstall attempt!"
      when: 
        - verify_uninstall is defined
        - "'STILL_EXISTS' in verify_uninstall.stdout"

    - name: Remove installation directory
      win_file:
        path: C:\Program Files\Keysight\CloudLens
        state: absent
      ignore_errors: true

    - name: Remove ProgramData directory
      win_file:
        path: C:\ProgramData\CloudLens
        state: absent
      ignore_errors: true

    - name: Delete installer from temp
      win_file:
        path: "C:\\temp\\{{ cloudlens_installer_filename }}"
        state: absent

    - name: Delete CA cert from temp
      win_file:
        path: C:\temp\cloudlens_ca.crt
        state: absent

    - name: Final status
      debug:
        msg: "CloudLens Agent successfully uninstalled"
      when: "'SUCCESSFULLY_REMOVED' in verify_uninstall.stdout"